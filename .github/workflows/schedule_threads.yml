name: 2. Threads Auto Post (Mon/Fri 8:00 PM KST)

on:
  schedule:
    - cron: '0 11 * * 1,5'  # 월, 금 UTC 11:00 = 한국 시간 오후 8:00
  workflow_dispatch:

jobs:
  post-to-threads:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v3

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 파이썬 라이브러리 설치
        run: |
          pip install requests

      - name: 스레드로 자동 포스팅
        env:
          META_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python scripts/post_to_threads.py
