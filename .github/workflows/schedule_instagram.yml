name: 1. Instagram Auto Post (Mon/Fri 11:30 AM KST)

on:
  schedule:
    - cron: '30 2 * * 1,5'  # 월(1), 금(5) UTC 02:30 = 한국 시간 월, 금 오전 11:30
  workflow_dispatch:

jobs:
  post-to-instagram:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v3

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 카드뉴스 생성용 시스템 패키지 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils

      - name: 파이썬 라이브러리 설치
        run: |
          pip install python-pptx requests

      - name: 카드뉴스 자동 생성 및 색상 순환 업데이트
        run: python scripts/generate_cards.py

      - name: 생성된 이미지와 변경된 JSON(색상)을 GitHub에 저장 (Commit)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/images/ posts/current_post.json
          git commit -m "Auto-generate cards and update theme color" || echo "No changes to commit"
          git push

      - name: 인스타그램으로 자동 포스팅
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/post_to_instagram.py
