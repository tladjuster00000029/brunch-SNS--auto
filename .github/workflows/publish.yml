name: Generate Card News and Publish SNS

on:
  workflow_dispatch:
  push:
    paths:
      - "posts/current_post.json"
      - "scripts/generate_cards.py"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. 필수 패키지(python-pptx, LibreOffice, 폰트) 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils fonts-noto-cjk fontconfig
          if [ -d "assets/fonts" ]; then
            sudo cp -r assets/fonts/* /usr/local/share/fonts/ || true
            sudo fc-cache -fv
          elif [ -d "fonts" ]; then
            sudo cp -r fonts/* /usr/local/share/fonts/ || true
            sudo fc-cache -fv
          fi
          pip install python-pptx Pillow requests

      - name: 4. 카드뉴스 생성 스크립트 실행 (scripts/generate_cards.py)
        run: |
          python3 scripts/generate_cards.py

      - name: 5. 생성된 카드뉴스 이미지 및 다음 테마 색상 자동 저장·푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f posts/images/ posts/current_post.json || true
          git diff --staged --quiet || (git commit -m "chore: generate card news images" && git push)

      - name: 6. 실행 결과 화면 다운로드 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: card-news-images
          path: |
            posts/images/*.png
            posts/images/*.jpg
