name: Generate Card News and Publish SNS

on:
  workflow_dispatch:
  push:
    paths:
      - "posts/current_post.json"
      - "post.json"
      - "generate*.py"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. 필수 패키지 및 한글 폰트 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install Pillow requests

      - name: 4. 카드뉴스 생성 스크립트 자동 검색 및 실행
        run: |
          # 1. 파일 자동 탐색 (generate_cards.py, generate_catds.py, scripts/ 등 탐색)
          SCRIPT=""
          if [ -f "generate_cards.py" ]; then
            SCRIPT="generate_cards.py"
          elif [ -f "generate_catds.py" ]; then
            SCRIPT="generate_catds.py"
          elif [ -f "scripts/generate_cards.py" ]; then
            SCRIPT="scripts/generate_cards.py"
          else
            SCRIPT=$(find . -maxdepth 2 -name "generate*.py" | head -n 1)
          fi

          if [ -n "$SCRIPT" ]; then
            echo "🚀 스크립트 발견 및 실행: $SCRIPT"
            python3 "$SCRIPT"
          else
            echo "❌ generate로 시작하는 파이썬 파일을 찾을 수 없습니다."
            echo "📂 현재 저장소 파일 목록:"
            ls -la
            exit 1
          fi

      - name: 5. 생성된 카드뉴스 이미지 저장소에 자동 저장 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f posts/images/ || true
          git diff --staged --quiet || (git commit -m "chore: generate card news images" && git push)

      - name: 6. 실행 결과 화면 다운로드 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: card-news-images
          path: posts/images/*.jpg
