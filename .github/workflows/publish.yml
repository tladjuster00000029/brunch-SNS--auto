name: Generate Card News and Publish SNS

on:
  workflow_dispatch:
  push:
    paths:
      - "posts/current_post.json"
      - "post.json"
      - "generate_cards.py"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. 필수 패키지 및 한글 폰트 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install Pillow requests

      - name: 4. 카드뉴스 생성 스크립트 실행
        run: |
          python3 generate_cards.py

      - name: 5. 생성된 카드뉴스 이미지 저장소에 자동 저장 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f posts/images/
          git diff --staged --quiet || (git commit -m "chore: generate card news images" && git push)

      - name: 6. 실행 결과 화면 다운로드 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: card-news-images
          path: posts/images/*.jpg
