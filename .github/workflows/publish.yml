import json
import os
import re
from PIL import Image, ImageDraw, ImageFont

# ==============================================================================
# 1. 캔버스 및 글자수 제한 상수 설정
# ==============================================================================
CANVAS_WIDTH = 1024
CANVAS_HEIGHT = 1024
MARGIN_X = 48

# [요청사항 1] 1번 슬라이드 부제 한 줄 최대 글자수 제한 (어절 단위 줄바꿈 연동)
SLIDE1_MAIN_TITLE_MAX_CHARS = 7       # 메인 타이틀 한 줄 최대 글자수 (드론 이미지 침범 방지)
SLIDE1_SUBTITLE_MAX_CHARS = 12        # 부제 한 줄 최대 글자수

# [요청사항 2] 2~5번 슬라이드 콜론(:) 이후 본문 한 줄 최대 글자수 제한
BULLET_BODY_MAX_CHARS = 22            # 콜론(:) 뒤 본문 한 줄 최대 글자수


def load_korean_font(size: int, bold: bool = False) -> ImageFont.FreeTypeFont:
    """시스템 또는 프로젝트 내 한글 폰트를 우선순위에 따라 로드합니다."""
    candidates = (
        [
            "fonts/Pretendard-Bold.ttf",
            "fonts/NotoSansKR-Bold.ttf",
            "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc",
            "/usr/share/fonts/truetype/nanum/NanumSquareB.ttf",
            "/usr/share/fonts/truetype/nanum/NanumGothicBold.ttf",
        ]
        if bold
        else [
            "fonts/Pretendard-Medium.ttf",
            "fonts/NotoSansKR-Regular.ttf",
            "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc",
            "/usr/share/fonts/truetype/nanum/NanumSquareR.ttf",
            "/usr/share/fonts/truetype/nanum/NanumGothic.ttf",
        ]
    )
    for path in candidates:
        if os.path.exists(path):
            try:
                return ImageFont.truetype(path, size)
            except Exception:
                continue
    return ImageFont.load_default()


# ==============================================================================
# 2. 이모지/기호 그래픽 렌더링 헬퍼 (폰트 깨짐 ☑ 완벽 방지)
# ==============================================================================
def draw_lightbulb_icon(img: Image.Image, x: int, y: int, size: int = 34):
    """전구(💡) 아이콘을 깨짐 없이 깔끔한 벡터 그래픽으로 그립니다."""
    bulb_png = "artifacts/file_generation/ttl=63d/intermediate/bulb_icon.png"
    if os.path.exists(bulb_png):
        icon = Image.open(bulb_png).convert("RGBA").resize((size + 4, size + 6))
        img.paste(icon, (int(x), int(y - 2)), icon)
        return

    draw = ImageDraw.Draw(img)
    cx, cy = x + size // 2, y + size // 2 - 3
    r = size // 2 - 3
    draw.ellipse([cx - r, cy - r, cx + r, cy + r], fill="#FFD43B", outline="#F59F00", width=2)
    draw.rectangle([cx - r // 2, cy + r - 3, cx + r // 2, cy + r + 6], fill="#ADB5BD")


def draw_check_icon(img: Image.Image, x: int, y: int, size: int = 34):
    """체크(✔) 아이콘을 깨짐 없이 깔끔하게 그립니다."""
    check_png = "artifacts/file_generation/ttl=63d/intermediate/check_icon.png"
    if os.path.exists(check_png):
        icon = Image.open(check_png).convert("RGBA").resize((size + 6, size + 6))
        img.paste(icon, (int(x), int(y - 2)), icon)
        return

    draw = ImageDraw.Draw(img)
    p1 = (x + 4, y + size // 2 + 2)
    p2 = (x + size // 2 - 2, y + size - 4)
    p3 = (x + size - 2, y + 6)
    draw.line([p1, p2, p3], fill="#8E9AAF", width=5, joint="curve")


# ==============================================================================
# 3. 줄바꿈 & 콜론(:) 기준 내어쓰기(Hanging Indent) 핵심 함수
# ==============================================================================
def get_text_width(draw: ImageDraw.ImageDraw, text: str, font: ImageFont.FreeTypeFont) -> float:
    return draw.textlength(text, font=font)


def wrap_text_by_pixel_and_chars(
    draw: ImageDraw.ImageDraw,
    text: str,
    font: ImageFont.FreeTypeFont,
    max_pixel_width: float,
    max_chars_per_line: int = 999,
) -> list[str]:
    """
    어절(띄어쓰기) 단위로 줄바꿈하되,
    1) 최대 픽셀 폭(max_pixel_width)과
    2) 한 줄 최대 글자수(max_chars_per_line)를 동시에 지키도록 줄을 나눕니다.
    """
    # 다중 공백을 단일 공백으로 정규화하여 띄어쓰기 때문에 줄이 어긋나는 현상 방지
    normalized = "\n".join(re.sub(r"[ \t]+", " ", p.strip()) for p in text.split("\n"))
    paragraphs = normalized.split("\n")
    lines = []

    for para in paragraphs:
        if not para:
            continue
        words = para.split(" ")
        current_line = words[0]
        for word in words[1:]:
            candidate = f"{current_line} {word}"
            pixel_ok = get_text_width(draw, candidate, font) <= max_pixel_width
            char_ok = len(candidate) <= max_chars_per_line
            if pixel_ok and char_ok:
                current_line = candidate
            else:
                lines.append(current_line)
                current_line = word
        if current_line:
            lines.append(current_line)

    return lines


def draw_right_aligned_subtitle(
    draw: ImageDraw.ImageDraw,
    sub_title: str,
    font: ImageFont.FreeTypeFont,
    right_x: int,
    start_y: int,
    max_pixel_width: float,
    max_chars_per_line: int = SLIDE1_SUBTITLE_MAX_CHARS,
    line_spacing: int = 16,
    fill: str = "#FFFFFF",
) -> int:
    """
    [요청사항 1 해결]
    1번 이미지 부제에서 불필요한 앞쪽 콜론(': ')이나 중간 공백 때문에 라인이 깨지는 문제를 방지합니다.
    쉼표(,) 또는 지정된 글자수(max_chars_per_line)를 기준으로 균형 있게 줄을 나눈 뒤 우측 정렬합니다.
    """
    cleaned = re.sub(r"^:\s*", "", sub_title.strip())
    cleaned = re.sub(r"\s+,", ",", cleaned)  # 쉼표 앞 불필요한 공백 제거
    cleaned = re.sub(r"\s+\?", "?", cleaned)  # 물음표 앞 불필요한 공백 제거

    # 명시적 줄바꿈이 없고 쉼표(,)가 있으면 쉼표 뒤에서 1차 줄바꿈 유도
    if "\n" not in cleaned and "," in cleaned and len(cleaned) > max_chars_per_line:
        first, rest = cleaned.split(",", 1)
        cleaned = f"{first.strip()},\n{rest.strip()}"

    lines = wrap_text_by_pixel_and_chars(
        draw,
        cleaned,
        font,
        max_pixel_width=max_pixel_width,
        max_chars_per_line=max_chars_per_line,
    )

    y = start_y
    bbox = font.getbbox("가Ag")
    line_height = bbox[3] - bbox[1]

    for line in lines:
        line_w = get_text_width(draw, line, font)
        draw.text((right_x - line_w, y), line, font=font, fill=fill)
        y += line_height + line_spacing

    return y


def draw_hanging_indent_bullet(
    img: Image.Image,
    draw: ImageDraw.ImageDraw,
    text: str,
    font: ImageFont.FreeTypeFont,
    start_x: int,
    start_y: int,
    max_right_x: int,
    max_chars_per_line: int = BULLET_BODY_MAX_CHARS,
    line_spacing: int = 14,
    fill: str = "#FFFFFF",
) -> int:
    """
    [요청사항 2 해결]
    2~5페이지에서 일정 글자수 이상이라 다음 줄로 내려갈 때,
    콜론(':') 이후 첫 글자 라인에 맞춰 아랫줄이 정렬되도록 합니다.
    예: '• 이득금지의 원칙: 노후 물건을 신품 복구 시 가치 증가분 공제'
        -> 첫 줄 '• 이득금지의 원칙: '의 끝 X좌표(즉 '노후'가 시작하는 X좌표)를 계산하여,
           다음 줄로 내려간 '공제'가 정확히 '노후' 바로 아래 X좌표에서 시작하도록 그립니다.
    """
    bbox = font.getbbox("가Ag")
    line_height = bbox[3] - bbox[1]
    clean_text = re.sub(r"[ \t]+", " ", text.strip())

    # 이모지(💡, ✔)가 맨 앞에 있는 경우 아이콘으로 분리 렌더링
    icon_offset_x = 0
    if clean_text.startswith("💡"):
        draw_lightbulb_icon(img, start_x, start_y, size=line_height)
        clean_text = clean_text.lstrip("💡").strip()
        icon_offset_x = line_height + 14
    elif clean_text.startswith("✔"):
        draw_check_icon(img, start_x, start_y, size=line_height)
        clean_text = clean_text.lstrip("✔").strip()
        icon_offset_x = line_height + 14

    effective_start_x = start_x + icon_offset_x

    # 1. 문장 안에 콜론(':')이 있는 경우 -> 콜론 뒤 첫 글자 X좌표에 맞춰 내어쓰기!
    if ":" in clean_text:
        prefix_part, body_part = clean_text.split(":", 1)
        prefix = f"{prefix_part.strip()}: "
        body = body_part.strip()

        prefix_w = get_text_width(draw, prefix, font)
        body_start_x = effective_start_x + prefix_w
        available_body_w = max_right_x - body_start_x

        # 콜론 뒤 본문 공간이 충분할 때 콜론 기준 정렬 적용
        if available_body_w >= 240:
            draw.text((effective_start_x, start_y), prefix, font=font, fill=fill)
            wrapped_body = wrap_text_by_pixel_and_chars(
                draw,
                body,
                font,
                max_pixel_width=available_body_w,
                max_chars_per_line=max_chars_per_line,
            )
            y = start_y
            for line in wrapped_body:
                draw.text((body_start_x, y), line, font=font, fill=fill)
                y += line_height + line_spacing
            return y

    # 2. 콜론이 없거나 아이콘(💡/✔) 또는 기호(•, 1.)만 있는 경우 -> 기호 뒤 첫 글자 X좌표에 맞춰 내어쓰기
    match = re.match(r"^([•]|\d+\.)\s+", clean_text)
    if match:
        marker = match.group(0)
        body = clean_text[len(marker) :].strip()
        marker_w = get_text_width(draw, marker, font)
        body_start_x = effective_start_x + marker_w
        available_body_w = max_right_x - body_start_x

        draw.text((effective_start_x, start_y), marker, font=font, fill=fill)
        wrapped_body = wrap_text_by_pixel_and_chars(
            draw,
            body,
            font,
            max_pixel_width=available_body_w,
            max_chars_per_line=max_chars_per_line + 6,
        )
        y = start_y
        for line in wrapped_body:
            draw.text((body_start_x, y), line, font=font, fill=fill)
            y += line_height + line_spacing
        return y

    # 3. 일반 문장 (또는 💡/✔ 아이콘 뒤 콜론 없는 문장)
    wrapped = wrap_text_by_pixel_and_chars(
        draw,
        clean_text,
        font,
        max_pixel_width=(max_right_x - effective_start_x),
        max_chars_per_line=max_chars_per_line + 6,
    )
    y = start_y
    for line in wrapped:
        draw.text((effective_start_x, y), line, font=font, fill=fill)
        y += line_height + line_spacing
    return y


# ==============================================================================
# 4. 슬라이드별 생성 함수 (1 ~ 5페이지)
# ==============================================================================
def render_slide_1(data: dict, bg_image_path: str | None, output_path: str):
    if bg_image_path and os.path.exists(bg_image_path):
        img = Image.open(bg_image_path).convert("RGB").resize((CANVAS_WIDTH, CANVAS_HEIGHT))
    else:
        img = Image.new("RGB", (CANVAS_WIDTH, CANVAS_HEIGHT), "#0B1325")

    draw = ImageDraw.Draw(img)
    slide1 = data["cards"]["slide1"]

    font_main = load_korean_font(62, bold=True)
    font_sub = load_korean_font(44, bold=True)
    font_caption = load_korean_font(30, bold=True)

    right_x = CANVAS_WIDTH - 24
    max_title_width = 460  # 좌측 드론 일러스트와 겹치지 않는 우측 상단 폭

    # 메인 타이틀 (우측 정렬 + 글자수 제한으로 '재산상 손해와 / 배상' 2줄 배치)
    main_lines = wrap_text_by_pixel_and_chars(
        draw,
        slide1["main_title"],
        font_main,
        max_pixel_width=max_title_width,
        max_chars_per_line=SLIDE1_MAIN_TITLE_MAX_CHARS,
    )
    y = 28
    bbox_main = font_main.getbbox("가Ag")
    main_h = bbox_main[3] - bbox_main[1]
    for line in main_lines:
        w = get_text_width(draw, line, font_main)
        draw.text((right_x - w, y), line, font=font_main, fill="#FFFFFF")
        y += main_h + 10

    y += 22
    # 부제 (글자수 제한 + 띄어쓰기 정규화 + 우측 정렬)
    draw_right_aligned_subtitle(
        draw=draw,
        sub_title=slide1["sub_title"],
        font=font_sub,
        right_x=right_x,
        start_y=y,
        max_pixel_width=480,
        max_chars_per_line=SLIDE1_SUBTITLE_MAX_CHARS,
        line_spacing=14,
        fill="#FFFFFF",
    )

    # 우측 하단 요약 캡션 3줄
    caption_x = 508
    caption_y = 742
    for cap in slide1.get("left_caption", []):
        caption_y = draw_hanging_indent_bullet(
            img=img,
            draw=draw,
            text=cap,
            font=font_caption,
            start_x=caption_x,
            start_y=caption_y,
            max_right_x=CANVAS_WIDTH - 28,
            max_chars_per_line=20,
            line_spacing=10,
            fill="#FFFFFF",
        )
        caption_y += 18

    img.save(output_path, quality=95)


def render_content_slide(slide_data: dict, output_path: str):
    img = Image.new("RGB", (CANVAS_WIDTH, CANVAS_HEIGHT), "#0B111E")
    draw = ImageDraw.Draw(img)

    font_title = load_korean_font(52, bold=True)
    font_headline = load_korean_font(33, bold=False)
    font_bullet = load_korean_font(31, bold=True)
    font_note = load_korean_font(32, bold=True)

    y = 105
    y = draw_hanging_indent_bullet(
        img=img,
        draw=draw,
        text=slide_data["title"],
        font=font_title,
        start_x=MARGIN_X,
        start_y=y,
        max_right_x=CANVAS_WIDTH - MARGIN_X,
        max_chars_per_line=18,
        line_spacing=14,
        fill="#FFFFFF",
    )

    y = max(y + 55, 315)
    draw.text((MARGIN_X, y), slide_data["headline"], font=font_headline, fill="#FFFFFF")
    y += 95

    for bullet in slide_data["bullets"]:
        y = draw_hanging_indent_bullet(
            img=img,
            draw=draw,
            text=bullet,
            font=font_bullet,
            start_x=MARGIN_X,
            start_y=y,
            max_right_x=CANVAS_WIDTH - MARGIN_X,
            max_chars_per_line=BULLET_BODY_MAX_CHARS,
            line_spacing=14,
            fill="#FFFFFF",
        )
        y += 28

    y = max(y + 35, 760)
    draw_hanging_indent_bullet(
        img=img,
        draw=draw,
        text=slide_data["note"],
        font=font_note,
        start_x=MARGIN_X,
        start_y=y,
        max_right_x=CANVAS_WIDTH - MARGIN_X,
        max_chars_per_line=25,
        line_spacing=14,
        fill="#7CC644",
    )

    img.save(output_path, quality=95)


def render_slide_5(slide5_data: dict, output_path: str):
    img = Image.new("RGB", (CANVAS_WIDTH, CANVAS_HEIGHT), "#0B111E")
    draw = ImageDraw.Draw(img)

    font_title = load_korean_font(52, bold=True)
    font_headline = load_korean_font(33, bold=False)
    font_bullet = load_korean_font(30, bold=True)
    font_green = load_korean_font(30, bold=True)

    y = 105
    y = draw_hanging_indent_bullet(
        img=img,
        draw=draw,
        text=slide5_data["title"],
        font=font_title,
        start_x=MARGIN_X,
        start_y=y,
        max_right_x=CANVAS_WIDTH - MARGIN_X,
        max_chars_per_line=18,
        line_spacing=14,
        fill="#FFFFFF",
    )

    y = max(y + 55, 315)
    draw.text((MARGIN_X, y), slide5_data["headline"], font=font_headline, fill="#FFFFFF")
    y += 85

    for bullet in slide5_data["bullets"]:
        y = draw_hanging_indent_bullet(
            img=img,
            draw=draw,
            text=bullet,
            font=font_bullet,
            start_x=MARGIN_X,
            start_y=y,
            max_right_x=CANVAS_WIDTH - MARGIN_X,
            max_chars_per_line=BULLET_BODY_MAX_CHARS,
            line_spacing=12,
            fill="#FFFFFF",
        )
        y += 22

    y += 30
    for note in slide5_data["green_notes"]:
        y = draw_hanging_indent_bullet(
            img=img,
            draw=draw,
            text=note,
            font=font_green,
            start_x=MARGIN_X,
            start_y=y,
            max_right_x=CANVAS_WIDTH - MARGIN_X,
            max_chars_per_line=23,
            line_spacing=12,
            fill="#7CC644",
        )
        y += 22

    img.save(output_path, quality=95)


def generate_all_cards(json_path: str, output_dir: str, slide1_bg_path: str | None = None):
    os.makedirs(output_dir, exist_ok=True)
    with open(json_path, "r", encoding="utf-8") as f:
        data = json.load(f)

    render_slide_1(data, slide1_bg_path, os.path.join(output_dir, "slide-1.jpg"))
    for idx, slide_data in enumerate(data["cards"]["slides_2_to_4"], start=2):
        render_content_slide(slide_data, os.path.join(output_dir, f"slide-{idx}.jpg"))
    render_slide_5(data["cards"]["slide5"], os.path.join(output_dir, "slide-5.jpg"))
    print(f"카드뉴스 5장 생성 완료: {output_dir}")


if __name__ == "__main__":
    bg_default = "artifacts/file_generation/ttl=63d/intermediate/clean_bg1.jpg"
    generate_all_cards(
        json_path="artifacts/file_generation/ttl=63d/output/property_damage_post.json",
        output_dir="artifacts/file_generation/ttl=63d/output",
        slide1_bg_path=bg_default if os.path.exists(bg_default) else None,
    )
