name: Generate Card News and Publish SNS

on:
  workflow_dispatch:
    inputs:
      json_path:
        description: "게시할 JSON 파일 경로"
        required: false
        default: ""
  push:
    paths:
      - "posts/current_post.json"
      - "post.json"
      - "posts/*.json"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. 필수 패키지 및 한글 폰트 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install Pillow requests

      - name: 4. 카드뉴스 5장 이미지 생성 (부제 줄바꿈 + 콜론 내어쓰기 적용)
        run: |
          python3 - << 'EOF'
          import json
          import os
          import re
          from PIL import Image, ImageDraw, ImageFont

          possible_paths = [
              os.environ.get("INPUT_JSON_PATH", ""),
              "posts/current_post.json",
              "post.json",
              "current_post.json"
          ]
          json_path = None
          for p in possible_paths:
              if p and os.path.exists(p):
                  json_path = p
                  break

          if not json_path:
              raise FileNotFoundError("JSON 파일을 찾을 수 없습니다. (posts/current_post.json 또는 post.json 위치를 확인하세요)")

          print(f"📄 사용 중인 JSON 파일: {json_path}")
          output_dir = "posts/images"
          os.makedirs(output_dir, exist_ok=True)

          CANVAS_WIDTH = 1024
          CANVAS_HEIGHT = 1024
          MARGIN_X = 48

          SLIDE1_MAIN_TITLE_MAX_CHARS = 7
          SLIDE1_SUBTITLE_MAX_CHARS = 12
          BULLET_BODY_MAX_CHARS = 22

          def load_korean_font(size: int, bold: bool = False) -> ImageFont.FreeTypeFont:
              candidates = (
                  [
                      "fonts/Pretendard-Bold.ttf",
                      "fonts/NotoSansKR-Bold.ttf",
                      "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc",
                      "/usr/share/fonts/truetype/nanum/NanumSquareB.ttf",
                      "/usr/share/fonts/truetype/nanum/NanumGothicBold.ttf",
                  ]
                  if bold
                  else [
                      "fonts/Pretendard-Medium.ttf",
                      "fonts/NotoSansKR-Regular.ttf",
                      "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc",
                      "/usr/share/fonts/truetype/nanum/NanumSquareR.ttf",
                      "/usr/share/fonts/truetype/nanum/NanumGothic.ttf",
                  ]
              )
              for path in candidates:
                  if os.path.exists(path):
                      try:
                          return ImageFont.truetype(path, size)
                      except Exception:
                          continue
              return ImageFont.load_default()

          def draw_lightbulb_icon(img: Image.Image, x: int, y: int, size: int = 34):
              draw = ImageDraw.Draw(img)
              cx, cy = x + size // 2, y + size // 2 - 3
              r = size // 2 - 3
              draw.ellipse([cx - r, cy - r, cx + r, cy + r], fill="#FFD43B", outline="#F59F00", width=2)
              draw.rectangle([cx - r // 2, cy + r - 3, cx + r // 2, cy + r + 6], fill="#ADB5BD")

          def draw_check_icon(img: Image.Image, x: int, y: int, size: int = 34):
              draw = ImageDraw.Draw(img)
              p1 = (x + 4, y + size // 2 + 2)
              p2 = (x + size // 2 - 2, y + size - 4)
              p3 = (x + size - 2, y + 6)
              draw.line([p1, p2, p3], fill="#8E9AAF", width=5, joint="curve")

          def get_text_width(draw: ImageDraw.ImageDraw, text: str, font: ImageFont.FreeTypeFont) -> float:
              return draw.textlength(text, font=font)

          def wrap_text_by_pixel_and_chars(draw, text, font, max_pixel_width, max_chars_per_line=999):
              normalized = "\n".join(re.sub(r"[ \t]+", " ", p.strip()) for p in text.split("\n"))
              paragraphs = normalized.split("\n")
              lines = []
              for para in paragraphs:
                  if not para:
                      continue
                  words = para.split(" ")
                  current_line = words[0]
                  for word in words[1:]:
                      candidate = f"{current_line} {word}"
                      pixel_ok = get_text_width(draw, candidate, font) <= max_pixel_width
                      char_ok = len(candidate) <= max_chars_per_line
                      if pixel_ok and char_ok:
                          current_line = candidate
                      else:
                          lines.append(current_line)
                          current_line = word
                  if current_line:
                      lines.append(current_line)
              return lines

          def draw_right_aligned_subtitle(draw, sub_title, font, right_x, start_y, max_pixel_width, max_chars_per_line=SLIDE1_SUBTITLE_MAX_CHARS, line_spacing=16, fill="#FFFFFF"):
              cleaned = re.sub(r"^:\s*", "", sub_title.strip())
              cleaned = re.sub(r"\s+,", ",", cleaned)
              cleaned = re.sub(r"\s+\?", "?", cleaned)
              if "\n" not in cleaned and "," in cleaned and len(cleaned) > max_chars_per_line:
                  first, rest = cleaned.split(",", 1)
                  cleaned = f"{first.strip()},\n{rest.strip()}"
              lines = wrap_text_by_pixel_and_chars(draw, cleaned, font, max_pixel_width=max_pixel_width, max_chars_per_line=max_chars_per_line)
              y = start_y
              bbox = font.getbbox("가Ag")
              line_height = bbox[3] - bbox[1]
              for line in lines:
                  line_w = get_text_width(draw, line, font)
                  draw.text((right_x - line_w, y), line, font=font, fill=fill)
                  y += line_height + line_spacing
              return y

          def draw_hanging_indent_bullet(img, draw, text, font, start_x, start_y, max_right_x, max_chars_per_line=BULLET_BODY_MAX_CHARS, line_spacing=14, fill="#FFFFFF"):
              bbox = font.getbbox("가Ag")
              line_height = bbox[3] - bbox[1]
              clean_text = re.sub(r"[ \t]+", " ", text.strip())

              icon_offset_x = 0
              if clean_text.startswith("💡"):
                  draw_lightbulb_icon(img, start_x, start_y, size=line_height)
                  clean_text = clean_text.lstrip("💡").strip()
                  icon_offset_x = line_height + 14
              elif clean_text.startswith("✔"):
                  draw_check_icon(img, start_x, start_y, size=line_height)
                  clean_text = clean_text.lstrip("✔").strip()
                  icon_offset_x = line_height + 14

              effective_start_x = start_x + icon_offset_x

              if ":" in clean_text:
                  prefix_part, body_part = clean_text.split(":", 1)
                  prefix = f"{prefix_part.strip()}: "
                  body = body_part.strip()
                  prefix_w = get_text_width(draw, prefix, font)
                  body_start_x = effective_start_x + prefix_w
                  available_body_w = max_right_x - body_start_x
                  if available_body_w >= 240:
                      draw.text((effective_start_x, start_y), prefix, font=font, fill=fill)
                      wrapped_body = wrap_text_by_pixel_and_chars(draw, body, font, max_pixel_width=available_body_w, max_chars_per_line=max_chars_per_line)
                      y = start_y
                      for line in wrapped_body:
                          draw.text((body_start_x, y), line, font=font, fill=fill)
                          y += line_height + line_spacing
                      return y

              match = re.match(r"^([•]|\d+\.)\s+", clean_text)
              if match:
                  marker = match.group(0)
                  body = clean_text[len(marker):].strip()
                  marker_w = get_text_width(draw, marker, font)
                  body_start_x = effective_start_x + marker_w
                  available_body_w = max_right_x - body_start_x
                  draw.text((effective_start_x, start_y), marker, font=font, fill=fill)
                  wrapped_body = wrap_text_by_pixel_and_chars(draw, body, font, max_pixel_width=available_body_w, max_chars_per_line=max_chars_per_line + 6)
                  y = start_y
                  for line in wrapped_body:
                      draw.text((body_start_x, y), line, font=font, fill=fill)
                      y += line_height + line_spacing
                  return y

              wrapped = wrap_text_by_pixel_and_chars(draw, clean_text, font, max_pixel_width=(max_right_x - effective_start_x), max_chars_per_line=max_chars_per_line + 6)
              y = start_y
              for line in wrapped:
                  draw.text((effective_start_x, y), line, font=font, fill=fill)
                  y += line_height + line_spacing
              return y

          def render_slide_1(data, output_path):
              bg_path = "assets/clean_bg1.jpg"
              if os.path.exists(bg_path):
                  img = Image.open(bg_path).convert("RGB").resize((CANVAS_WIDTH, CANVAS_HEIGHT))
              else:
                  img = Image.new("RGB", (CANVAS_WIDTH, CANVAS_HEIGHT), "#0B1325")
              draw = ImageDraw.Draw(img)
              slide1 = data["cards"]["slide1"]
              font_main = load_korean_font(62, bold=True)
              font_sub = load_korean_font(44, bold=True)
              font_caption = load_korean_font(30, bold=True)
              right_x = CANVAS_WIDTH - 24
              max_title_width = 460
              main_lines = wrap_text_by_pixel_and_chars(draw, slide1["main_title"], font_main, max_pixel_width=max_title_width, max_chars_per_line=SLIDE1_MAIN_TITLE_MAX_CHARS)
              y = 28
              bbox_main = font_main.getbbox("가Ag")
              main_h = bbox_main[3] - bbox_main[1]
              for line in main_lines:
                  w = get_text_width(draw, line, font_main)
                  draw.text((right_x - w, y), line, font=font_main, fill="#FFFFFF")
                  y += main_h + 10
              y += 22
              draw_right_aligned_subtitle(draw, sub_title=slide1["sub_title"], font=font_sub, right_x=right_x, start_y=y, max_pixel_width=480, max_chars_per_line=SLIDE1_SUBTITLE_MAX_CHARS, line_spacing=14, fill="#FFFFFF")
              caption_x = 508
              caption_y = 742
              for cap in slide1.get("left_caption", []):
                  caption_y = draw_hanging_indent_bullet(img=img, draw=draw, text=cap, font=font_caption, start_x=caption_x, start_y=caption_y, max_right_x=CANVAS_WIDTH - 28, max_chars_per_line=20, line_spacing=10, fill="#FFFFFF")
                  caption_y += 18
              img.save(output_path, quality=95)

          def render_content_slide(slide_data, output_path):
              img = Image.new("RGB", (CANVAS_WIDTH, CANVAS_HEIGHT), "#0B111E")
              draw = ImageDraw.Draw(img)
              font_title = load_korean_font(52, bold=True)
              font_headline = load_korean_font(33, bold=False)
              font_bullet = load_korean_font(31, bold=True)
              font_note = load_korean_font(32, bold=True)
              y = 105
              y = draw_hanging_indent_bullet(img=img, draw=draw, text=slide_data["title"], font=font_title, start_x=MARGIN_X, start_y=y, max_right_x=CANVAS_WIDTH - MARGIN_X, max_chars_per_line=18, line_spacing=14, fill="#FFFFFF")
              y = max(y + 55, 315)
              draw.text((MARGIN_X
