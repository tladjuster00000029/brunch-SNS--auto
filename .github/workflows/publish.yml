name: SNS 카드뉴스 자동 생성 및 게시

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 저장소 파일 불러오기
        uses: actions/checkout@v4

      - name: 2. 카드뉴스 생성 및 저장소 자동 보관
        run: |
          mkdir -p posts/images
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils fontconfig fonts-noto-cjk
          pip install python-pptx Pillow requests
          sudo mkdir -p /usr/share/fonts/truetype/gmarket
          sudo cp assets/templates/*.ttf /usr/share/fonts/truetype/gmarket/ || true
          sudo cp assets/fonts/*.ttf /usr/share/fonts/truetype/gmarket/ || true
          sudo fc-cache -f -v
          python3 scripts/generate_cards.py

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/images/ posts/current_post.json
          git diff --staged --quiet || git commit -m "Auto-generate card news images"
          git push

      - name: 3. 내 PC로 다운로드할 압축파일(Artifact) 생성
        uses: actions/upload-artifact@v4
        with:
          name: card-news-images
          path: posts/images/
